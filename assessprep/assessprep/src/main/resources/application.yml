spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assessprep}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-it-must-be-at-least-32-bytes}
    expiration-minutes: 120
