# Add under "jobs:" in .github/workflows/ci.yml (commit package-lock.json first: run `npm install` once locally).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessprep/frontend   # adjust to where the frontend folder sits in your repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: assessprep/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
